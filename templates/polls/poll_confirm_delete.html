{% extends "base.html" %}

{% block title %}Anketi Sil · TeknoTerazi{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Anketi sil</h1>
  <p>"{{ poll.title }}" anketini silmek istediğine emin misin? Bu işlem geri alınamaz.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn--ghost">Evet, sil</button>
    <a href="{% url 'polls:poll_detail' poll.pk %}" class="btn">Vazgeç</a>
  </form>
</section>
{% endblock %}
