{% extends "base.html" %}

{% block title %}Giriş Yap · TeknoTerazi{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Giriş Yap</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <div class="form-row">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn--primary">Giriş Yap</button>
  </form>
  <p>Hesabın yok mu? <a href="{% url 'accounts:signup' %}">Kayıt ol</a></p>
</section>
{% endblock %}
