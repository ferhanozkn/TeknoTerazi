{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Sayfalama">
  {% if page_obj.has_previous %}
    <a href="?{{ querystring_prefix }}sayfa={{ page_obj.previous_page_number }}">‹ Önceki</a>
  {% endif %}
  {% for num in page_obj.paginator.page_range %}
    {% if num == page_obj.number %}
      <span class="pagination__current">{{ num }}</span>
    {% else %}
      <a href="?{{ querystring_prefix }}sayfa={{ num }}">{{ num }}</a>
    {% endif %}
  {% endfor %}
  {% if page_obj.has_next %}
    <a href="?{{ querystring_prefix }}sayfa={{ page_obj.next_page_number }}">Sonraki ›</a>
  {% endif %}
</nav>
{% endif %}
