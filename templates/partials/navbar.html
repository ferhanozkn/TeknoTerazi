<header class="navbar">
  <a href="{% url 'polls:home' %}" class="navbar__brand">⚖️ TeknoTerazi</a>
  <button type="button" class="navbar__toggle" id="navbar-toggle" aria-expanded="false" aria-controls="navbar-links" aria-label="Menüyü aç/kapat">
    <span></span><span></span><span></span>
  </button>
  <nav class="navbar__links" id="navbar-links">
    <a href="{% url 'polls:poll_create' %}" class="btn btn--primary">Anket Oluştur</a>
    {% if user.is_authenticated %}
      <a href="{% url 'accounts:profile' %}" class="navbar__user">@{{ user.username }}</a>
      <a href="{% url 'polls:my_polls' %}">Anketlerim</a>
      <form method="post" action="{% url 'accounts:logout' %}" class="navbar__logout">
        {% csrf_token %}
        <button type="submit" class="link-button">Çıkış</button>
      </form>
    {% else %}
      <a href="{% url 'accounts:login' %}">Giriş Yap</a>
      <a href="{% url 'accounts:signup' %}">Kayıt Ol</a>
    {% endif %}
  </nav>
</header>
