{% load static %}<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("tt_theme");
        if (theme === "dark" || theme === "light") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    })();
  </script>
  <title>{% block title %}TeknoTerazi{% endblock %}</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}TeknoTerazi{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Almadan önce topluluğa sor.{% endblock %}">
  {% block og_image %}{% endblock %}
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
  <meta name="theme-color" content="#6c3bff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TeknoTerazi">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  {% include "partials/navbar.html" %}
  {% include "partials/messages.html" %}
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}
  <script src="{% static 'js/nav.js' %}" defer></script>
  <script src="{% static 'js/theme.js' %}" defer></script>
  <script src="{% static 'js/register_sw.js' %}" defer></script>
</body>
</html>
